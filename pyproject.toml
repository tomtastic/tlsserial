[project]
name = "tlsserial"
version = "0.1.0"
description = "Examine TLS certificates, locally or online"
authors = [
    {name = "Tom Matthews"},
]
readme = "README.md"
requires-python = "<4.0,>=3.11"
dependencies = [
    "click>=8.1.6",
    "cryptography>=41.0",
    "pendulum>=3.0",
]
[dependency-groups]
dev = [
    "types-cryptography>=3.3.23.2",
    "mypy>1.4.1",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
